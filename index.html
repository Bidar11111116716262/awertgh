<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Besucherlog</title>

  <!-- Supabase JS (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<script>
  // ============================================================
  //  KONFIGURATION – hier deine Supabase-Daten eintragen
  // ============================================================
  const SUPABASE_URL      = 'https://ayvpkwjuixwpimosphfz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_AqJyDOcplRYhW0Mz6bzNjA_Avw82hZh';
  // ============================================================

  const TABELLE = 'besucher_log';

  // Konfigurationshinweis
  if (SUPABASE_URL.includes('DEIN-PROJEKT') || SUPABASE_ANON_KEY.includes('DEIN-ANON')) {
    document.getElementById('configHint').style.display = 'block';
  }

  const { createClient } = supabase;
  const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // UI-Elemente
  const ipEl     = document.getElementById('ipVal');
  const tsEl     = document.getElementById('tsVal');
  const pageEl   = document.getElementById('pageVal');
  const uaEl     = document.getElementById('uaVal');
  const statusEl = document.getElementById('statusText');
  const spinner  = document.getElementById('spinner');
  const feedback = document.getElementById('feedback');

  function showFeedback(type, msg) {
    feedback.className = 'feedback ' + type;
    feedback.innerHTML = (type === 'success' ? '✓ ' : '✗ ') + msg;
    spinner.style.display = 'none';
  }

  async function getIP() {
    try {
      const r = await fetch('https://api.ipify.org?format=json');
      const d = await r.json();
      return d.ip;
    } catch {
      return 'unbekannt';
    }
  }

  async function init() {
    const ip        = await getIP();
    const jetzt     = new Date();
    const userAgent = navigator.userAgent;
    const seite     = window.location.href;

    // UI befüllen
    ipEl.textContent   = ip;
    tsEl.textContent   = jetzt.toLocaleString('de-DE');
    uaEl.textContent   = userAgent.substring(0, 80) + (userAgent.length > 80 ? '…' : '');
    pageEl.textContent = seite;

    statusEl.textContent = 'Speichere…';

    // In Supabase speichern
    const { error } = await client.from(TABELLE).insert({
      ip,
      user_agent: userAgent,
      seite,
      erstellt_am: jetzt.toISOString(),
    });

    if (error) {
      statusEl.textContent = 'Fehler';
      showFeedback('error', error.message);
      return;
    }

    statusEl.textContent = 'Gespeichert';
    showFeedback('success', 'Eintrag erfolgreich gespeichert.');

    // Letzte Einträge laden (klappt nur wenn auth oder Policy angepasst)
    loadLog();
  }

  async function loadLog() {
    const { data, error } = await client
      .from(TABELLE)
      .select('erstellt_am, ip, seite')
      .order('erstellt_am', { ascending: false })
      .limit(10);

    if (error || !data || data.length === 0) return;

    const card = document.getElementById('logCard');
    const body = document.getElementById('logBody');
    card.style.display = 'block';

    body.innerHTML = data.map(row => `
      <tr>
        <td>${new Date(row.erstellt_am).toLocaleString('de-DE')}</td>
        <td><span class="ip-badge">${row.ip}</span></td>
        <td>${new URL(row.seite).pathname || '/'}</td>
      </tr>
    `).join('');
  }

  init();
</script>
</body>
</html>
