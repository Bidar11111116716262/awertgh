<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pepos IP</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }
    .ip {
      color: #00e5ff;
      font-size: clamp(1.5rem, 8vw, 3.5rem);
      letter-spacing: 0.05em;
    }
    h1{
      text-align: center;
       color: #00e5ff;
    }
  </style>
</head>
<body>
  <h1>get doxed <br> pepo</h1>
  <div class="ip" id="ip">…</div>
  <script>
    fetch('https://api.ipify.org?format=json')
      .then(r => r.json())
      .then(d => document.getElementById('ip').textContent = d.ip)
      .catch(() => document.getElementById('ip').textContent = 'unbekannt');
  </script>
</body>
</html>
